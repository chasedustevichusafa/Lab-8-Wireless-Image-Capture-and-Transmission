name: Download Lab 8 firmware

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/remote-files', 'feature/high-baud-link', 'fix/file-transfer-stability', 'feature/remote-upload', 'feature/remote-file-management', 'feature/remote-camera']
    paths:
      - 'Astro-331-2026-Fall/Astro331_Lab8_Code/**'
      - '.github/workflows/lab8-firmware.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Astro-331-2026-Fall/Astro331_Lab8_Code
      - name: Package only the PlatformIO project
        shell: pwsh
        run: |
          $project = 'Astro-331-2026-Fall/Astro331_Lab8_Code'
          $destination = 'package/KestrelSAT-Lab8'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($name in @('platformio.ini', 'README.md', 'include', 'src', 'test', 'lib')) {
            Copy-Item (Join-Path $project $name) $destination -Recurse
          }
          $files = Get-ChildItem $destination -Recurse -File
          foreach ($required in @('platformio.ini', 'README.md', 'src/main.cpp',
                                  'include/file_service.h', 'include/camera_job.h', 'include/camera_hardware.h',
                                  'test/host_service.cpp', 'test/host_camera.h', 'test/test_protocol.py',
                                  'lib/Arducam_Mega-3.0.0/src/Arducam_Mega.h',
                                  'lib/Arducam_Mega-3.0.0/src/Arducam/ArducamCamera.c',
                                  'lib/Arducam_Mega-3.0.0/LICENSE')) {
            if (-not (Test-Path (Join-Path $destination $required) -PathType Leaf)) {
              throw "Missing required firmware source: $required"
            }
          }
          $expected = foreach ($name in @('platformio.ini', 'README.md', 'include', 'src', 'test', 'lib')) {
            Get-ChildItem (Join-Path $project $name) -Recurse -File
          }
          if ($files.Count -ne $expected.Count) { throw 'Packaging omitted source files' }
          Compress-Archive -Path $destination -DestinationPath validation.zip
          Expand-Archive -Path validation.zip -DestinationPath extracted
          foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path 'package').Path, $file.FullName)
            $restored = Join-Path 'extracted' $relative
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $restored).Hash) {
              throw "ZIP round-trip changed $relative"
            }
          }
          Write-Host 'Windows ZIP extraction and all source file checksums passed.'
      - uses: actions/upload-artifact@v4
        with:
          name: KestrelSAT-Lab8-Firmware
          path: package/
          if-no-files-found: error
          retention-days: 30
