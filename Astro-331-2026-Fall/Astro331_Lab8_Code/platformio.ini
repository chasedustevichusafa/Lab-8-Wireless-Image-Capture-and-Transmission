; Keep the board and radio wiring used by the working lab projects.
; HOW TO READ THIS FILE:
; An environment is a build configuration, not a radio configuration command.
; Selecting it supplies preprocessor values to main.cpp. XCTU must separately
; program each radio's UART baud and AP mode; the GCS baud must match its ground
; radio. The satellite radio remains AP=0 even when the ground uses API/AP=1.
; USB monitor_speed is independent of XBEE_UART_BAUD and remains 115200.
; Camera CS must match the physical wire. Both GPIO27 environments use exactly
; the same shared-SPI camera/SD implementation; they differ in radio UART baud.
; A higher UART rate does not change the RF bitrate or remove request/ACK waits.
; Every environment supports FAST1; the GCS negotiates chunk/codec per file.
; Profiles do not change radio settings. Baseline 128-byte hex remains available.
[platformio]
default_envs = esp32thing_plus

[env:esp32thing_plus]
platform = espressif32
board = sparkfun_esp32s2_thing_plus_c
framework = arduino
monitor_speed = 115200
lib_deps = greiman/SdFat@^2.3.1

; Select this environment only after configuring the satellite XBee BD=115200.
[env:esp32thing_plus_115200]
extends = env:esp32thing_plus
build_flags = -D XBEE_UART_BAUD=115200

; Optional GPIO12 boot/flash remedy. With ALL power disconnected, move camera
; CS to GPIO27 after confirming that pin is otherwise unused on your hardware.
[env:esp32thing_plus_115200_camera_cs27]
extends = env:esp32thing_plus_115200
build_flags = -D XBEE_UART_BAUD=115200 -D CAMERA_CS_PIN=27

; Slow-baud comparison using the same confirmed GPIO27 camera wiring.
; Configure both radio UARTs and the GCS for 9600 before testing this build.
[env:benchmark_9600_cs27]
extends = env:esp32thing_plus
build_flags = -D XBEE_UART_BAUD=9600 -D CAMERA_CS_PIN=27
